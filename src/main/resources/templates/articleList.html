<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>블로그 글 목록</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="p-4 text-center bg-light">
    <h1 class="mb-2">My Blog</h1>
    <h5>블로그에 당신의 생각을 환영합니다</h5>
</div>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
    <span class="navbar-text font-weight-bold" th:if="${nickname != null}" th:text="|반갑습니다, ${nickname}님|"></span>
    <button type="button" class="btn btn-secondary btn-sm ml-auto" onclick="location.href='/logout'">로그아웃</button>
</nav>
<div class="container mt-4">
    <button type="button" class="btn btn-secondary btn-sm mb-3" onclick="location.href='/new-article'" id="create-btn">글 등록</button>
    <div th:each="item : ${articles}" class="mb-3">
        <div class="card">
            <div class="card-header" th:text="${item.id}"></div>
            <div class="card-body">
                <h5 class="card-title" th:text="${item.title}"></h5>
                <p class="card-text" th:text="${item.content}"></p>
                <a th:href="@{/articles/{id}(id=${item.id})}" class="btn btn-primary">보러가기</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
