<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>

<h1>
    안녕 <span th:text="${name}"></span>
</h1>

<table border="1">
    <tr th:each="item : ${articles}">
        <td th:text="${item.title}"></td>
        <td th:text="${item.content}"></td>
    </tr>
</table>

<div th:object="${person}">
    <p th:text="|이름: *{name}|"></p>
    <p th:text="|나이: *{age}|"></p>
    <p th:text="|아이디: *{id}|"></p>

    <!-- 취미 출력 -->
    <ul>
        <li th:each="hobby : *{hobbies}" th:text="${hobby}"></li>
    </ul>
</div>

<div th:if="${error != null}">
    에러가 발생
</div>

<div th:if="${error == null}">
    정상
</div>

<p th:text="${#temporals.format(today, 'MM-dd-yyyy')}"></p>

</body>
</html>
